; Director override — mounted at /etc/app/conf.d/director.ini.
; Verbatim from the BattleGroup CR's spec.utilities.director.configFiles.files.director.ini.
; Layered on top of the baked-in /Tools/Battlegroups/Director/BattlegroupDirector/director_config.ini.

[ Battlegroup ]
AuthorizationPreset = BattlegroupInternal

[ InstancingModes ]
DeepDesert_1=ClassicalInstancing

; All on-demand maps below get EnableAutomaticInstanceScaling=true so the
; director PATCHes replicas:0→1 whenever a player queues for them. Without
; this flag, K8s relied on restartScalers + server-operator to pre-scale
; matching maps — a flow we don't replicate. The flag makes the director
; do the scale-up itself when a player tries to travel.

[ CB_Dungeon_Hephaestus ]
EnableAutomaticInstanceScaling = true
NumExtraServers = 0

[ CB_Dungeon_OldCarthag ]
EnableAutomaticInstanceScaling = true
NumExtraServers = 0

