## Game RabbitMQ — TLS-only AMQPS on container 5672 (published as 31982).
## HTTP auth backend identical to admin RMQ; certs mounted at /etc/rabbitmq/{cacert,cert,key}.pem.

## Bug 1 (orphan player queues): player queues are declared autoDelete=false by the
## bg-director and never cleaned up. Apply a TTL policy via a definitions file so
## queues matching <flsId>_queue self-delete after 10 min idle (no consumers).
## See dune-setup/rabbitmq-game-definitions.json.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

auth_backends.1 = $(RMQ_AUTH_BACKEND_1)

auth_cache.cache_ttl = 5000
auth_cache.cached_backend = http

auth_http.http_method   = post
auth_http.user_path     = http://$(RMQ_HTTP_AUTH_ADDRESS)/v0/auth/user
auth_http.vhost_path    = http://$(RMQ_HTTP_AUTH_ADDRESS)/v0/auth/vhost
auth_http.resource_path = http://$(RMQ_HTTP_AUTH_ADDRESS)/v0/auth/resource
auth_http.topic_path    = http://$(RMQ_HTTP_AUTH_ADDRESS)/v0/auth/topic

listeners.tcp = none

listeners.ssl.default            = 5672
ssl_options.cacertfile           = /etc/rabbitmq/cacert.pem
ssl_options.certfile             = /etc/rabbitmq/cert.pem
ssl_options.keyfile              = /etc/rabbitmq/key.pem
ssl_options.verify               = verify_none
ssl_options.fail_if_no_peer_cert = false
