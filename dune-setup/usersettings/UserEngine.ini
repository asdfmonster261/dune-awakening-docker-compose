; Settings here apply to every game server in the battlegroup.
; This file is mounted into each game-server pod at Saved/UserSettings/UserEngine.ini.
;
; setup.sh patches the Bgd.ServerDisplayName line below to enable it with your chosen name.
; Restart the game-server containers (`docker compose restart game-server-survival game-server-overmap`)
; after edits to pick up the change.

[URL]
; Starting port that servers listen to for players. Each pod uses its own value
; (set per-service via -ini:engine:[URL]:Port=N in docker-compose.yml).
Port=7777
; Port for server-to-server traffic. Same per-service override pattern.
IGWPort=7888

[ConsoleVariables]
; ★ Player-facing browser name. setup.sh uncomments this with your chosen value.
;Bgd.ServerDisplayName="My Arrakis, My Dune"

; ★ Optional server password.
;Bgd.ServerLoginPassword="Sandworm"

; Mining multipliers
Dune.GlobalMiningOutputMultiplier=1.0
Dune.GlobalVehicleMiningOutputMultiplier=1.0
SecurityZones.PvpResourceMultiplier=2.5

; Durability damage multiplier for vehicles (0 to 10; 0=off)
dw.VehicleDurabilityDamageMultiplier=1.0

; Sandstorm and treasure-spawning settings
Sandstorm.Enabled=1
Sandstorm.Treasure.Enabled=1

; Sandworm settings
sandworm.dune.Enabled=1
Vehicle.SandwormCollisionInteraction=false
Sandworm.SandwormDangerZonesEnabled=true
Vehicle.SandwormInvulnerabilitySecondsOnExit=900.0
Vehicle.SandwormInvulnerabilitySecondsOnServerRestart=7200.0
