; Game-server DB override — mounted at Saved/UserSettings/UserGame.ini.
; Overrides DefaultGame.ini's DuneDatabaseInterfacePSQL with our postgres service.
; DatabasePassword is set via env var (POSTGRES_DUNE_PASS → Database__password)
; rather than written here, to keep this file safe to commit.

[DuneDatabaseInterfacePSQL]
DatabaseHost = postgres:5432
DatabaseName = dune
DatabaseUser = dune
